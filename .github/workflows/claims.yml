name: claims

# A PR that says 'added field X' must prove X reaches real output.
# Exists because a merged PR once claimed to expose aggregate fields that never
# reached any CLI exit path. Written claims are checked, not trusted.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify-claims:
    name: verify PR claims against real CLI output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need base branch history to diff changed files
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt -r tests/requirements-dev.txt
      - name: write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: compute changed files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --quiet origin "$BASE_REF"
          git diff --name-status "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed.txt"
          echo "changed files: $(wc -l < "$RUNNER_TEMP/changed.txt")"
      - name: verify claims
        run: |
          python scripts/verify-claims.py \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --changed-files "$RUNNER_TEMP/changed.txt"

      - name: self-test the verifier
        run: python -m pytest tests/test_verify_claims.py -q
