name: claims

# A PR that says 'added field X' must prove X reaches real output.
# Exists because a merged PR once claimed to expose aggregate fields that never
# reached any CLI exit path. Written claims are checked, not trusted.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  verify-claims:
    name: verify PR claims against real CLI output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: verify claims
        run: python scripts/verify-claims.py --body-file "$RUNNER_TEMP/pr-body.md"

      - name: self-test the verifier
        run: python -m pytest tests/test_verify_claims.py -q
